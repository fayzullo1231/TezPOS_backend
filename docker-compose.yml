services:
  db:
    image: postgres:16-alpine
    container_name: tezpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tezpos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tezpos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tezpos"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  tezpos_pg_data:
